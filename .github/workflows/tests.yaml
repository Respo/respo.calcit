name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: respo-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  VITE_BASE_URL: ${{ github.event_name == 'pull_request' && './' || format('https://cos-sh.tiye.me/{0}/', github.repository) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: 0.1.1

      - name: "load deps"
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Validate Calcit snapshot and strict types
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru fix --workflow strict --verify --format edn

      - name: "test"
        run: |
          calcit calcit.cirru test --require-match --summary-only --format json
          calcit calcit.cirru analyze check-examples --ns respo.resource --def resource-idle
          calcit calcit.cirru analyze check-examples --ns respo.resource --def resource-idle --js
          for ns in respo.core respo.util.detect respo.util.list respo.app.comp.todolist; do
            calcit calcit.cirru analyze check-examples --ns "$ns"
          done
          # respo.css, respo.comp.space and respo.util.format examples rely on JS-only host APIs
          for ns in respo.core respo.util.detect respo.util.list respo.app.comp.todolist respo.css respo.comp.space respo.util.format; do
            calcit calcit.cirru analyze check-examples --ns "$ns" --js
          done

      - name: Check framework definitions and dynamic methods
        run: yarn check-framework-types

      - name: Check nominal accessor boundaries
        run: yarn test-nominal-accessors

      - name: Test nominal DOM patch protocol
        run: yarn test-dom-patch-types

      - name: Test callback type boundaries
        run: yarn test-callback-types

      - name: Test typed dispatch
        run: yarn test-typed-dispatch

      - name: "test typed DOM host"
        run: yarn test-dom-host

      - name: Test nullish DOM props
        run: node --test test/nullish-props.test.mjs

      - name: Test DOM prop removal
        run: node --test test/remove-props.test.mjs

      - name: Test event configuration
        run: yarn test-event-config

      - name: Test SSR escaping and Node styles
        run: yarn test-ssr

      - name: Test demo render scheduling
        run: yarn test-demo-scheduler

      - name: Test saved-task normalization and nominal identity
        run: yarn test-persisted-tasks

      - name: Test memo frame lifecycle
        run: yarn test-memo

      - name: Test keyed node moves
        run: yarn test-keyed-moves

      - name: Verify mixed cursor keys
        run: yarn test-cursor-keys

      - name: Test typed render traversal
        run: yarn test-render-traversal

      - name: Test patch lookup and duplicate keys
        run: yarn test-patch-lookup

      - name: "check docs markdown"
        run: bash scripts/check-docs-md.sh

      - name: "build js"
        run: >
          calcit calcit.cirru js
          && yarn vite build --base="$VITE_BASE_URL"

      - name: Save PR frontend build for browser acceptance
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          retention-days: 1

      - name: Check current production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Upload and verify frontend
        if: steps.production.outputs.current == 'true'
        timeout-minutes: 10
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ github.repository }}/
          public-base-url: ${{ env.VITE_BASE_URL }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy to server
        if: steps.production.outputs.current == 'true'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: steps.production.outputs.current == 'true'
        run: echo "${{ steps.deploy.outputs.status }}"
